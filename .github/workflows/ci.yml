name: Java CI/CD Pipeline

on:
  push:
    branches: [ "main", "master", "4.0-lecture-ci-cd" ]

jobs:

  test:
    name: Build and Run Tests
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v3

      - name: Set up JDK 17
        uses: actions/setup-java@v3
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Build with Maven
        run: mvn clean install

  deploy:
    name: Deploy to Render
    needs: test
    if: github.ref == 'refs/heads/main' || github.ref == 'refs/heads/master' || github.ref == 'refs/heads/4.0-lecture-ci-cd'
    runs-on: ubuntu-latest

    steps:
      - name: Trigger Render Deploy Hook
        run: |
          curl -f ${{ secrets.RENDER_DEPLOY_HOOK_URL }}